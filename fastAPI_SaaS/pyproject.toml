[project]
name = "multicatalogo-saas"
version = "0.1.0"
description = "Capa SaaS / multitenant de MultiCatálogo sobre FastAPI"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = { text = "MIT" }
authors = [
    { name = "MultiCatálogo Team" },
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    # pydantic[email]: habilita EmailStr (validacion de dominio) usada en
    # app/schemas/user.py y app/schemas/plan.py.
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # sqlalchemy[asyncio]: trae greenlet, requerido por el motor async
    # de SQLAlchemy 2.x (app/core/db.py). Sin el extra, importar
    # sqlalchemy.ext.asyncio lanza ImportError.
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.30,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.12,<1.0",
    # httpx: usado en runtime por app/api/auth.py para proxy al auth-service.
    "httpx>=0.27,<1.0",
    # bcrypt: hashing de passwords para users_saas (app/crud/user.py).
    "bcrypt>=4.1,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "aiosqlite>=0.20,<1.0",
    # pyjwt: tests/integration/test_auth_integration.py decodifica los JWT
    # que emite el auth-service para verificar claims y firma. Ningun
    # proyecto lo declaraba, asi que la coleccion de pytest fallaba con
    # ModuleNotFoundError: No module named 'jwt'.
    "pyjwt>=2.9,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# Alembic configuration. Ver https://alembic.sqlalchemy.org/en/latest/tutorial.html
#
# En este proyecto la URL de la BD NO se hardcodea: la lee
# `alembic/env.py` desde `app.core.config.settings.database_url_sync`
# para tener una sola fuente de verdad (env vars + .env).

[alembic]
# Path al directorio de scripts de migracion (default: alembic)
script_location = alembic

# template_path = alembic/script.py.mako (default; comentado porque ya lo es)

# Activar logging alembic; comentar para silenciar.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

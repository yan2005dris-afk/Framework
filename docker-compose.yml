# Docker Compose raiz para MultiCatalogo.
#
# Levanta los 6 servicios del stack:
#   - gateway      (Caddy :8080 host)    - punto de entrada unico: sirve el
#                                          SPA compilado en / y proxea /api/*
#   - auth-service (:3001)             - emision/validacion de JWTs
#   - backend      (:3000)             - B2C: catalogo+checkout+MLM
#   - saas-api     (:8000)             - SaaS multi-tenant
#   - redis        (:6379)             - cache del Backend
#   - db           (:5432)             - Postgres compartido
#
# El frontend va DENTRO de la imagen del gateway (build multistage), asi que
# `docker compose up -d` deja la app completa en :8080 y no hay frontend que
# levantar aparte.
#
# Para desarrollo hay ademas un servicio `frontend` bajo el profile `dev`: Vite
# con HMR sobre el codigo del host, en :5173. Solo arranca si se pide el
# profile; el build de produccion nunca pasa por ahi.
#
# Comandos utiles (desde la raiz del repo):
#   docker compose up -d              # arranca todo (SPA incluido, en :8080)
#   docker compose up -d --build       # rebuild imagenes tras cambios en codigo
#   docker compose --profile dev up -d frontend   # SPA con HMR en :5173
#   docker compose logs -f gateway     # logs del gateway
#   docker compose logs -f backend auth-service saas-api
#   docker compose down                # baja todo, conserva volumenes
#   docker compose down -v             # baja TODO incluyendo volumenes (reset)
#
# Como correr local sin todo el stack (manteniendo compatibilidad):
#   docker compose up -d db redis        # solo infra
#   cd Backend && go run main.go          # Backend nativo en :3000
#   cd auth-service && go run main.go    # auth-service nativo en :3001
#   cd fastAPI_SaaS && uv run uvicorn ... # SaaS nativo en :8000
#   docker compose up gateway            # gateway Caddy en :8080 host (con SPA)
#   # OJO: en este modo hay que mapear host -> servicio con /etc/hosts
#   # o usar --network host. Lo mas simple: levantar todo via compose.

services:

  # ============================================================================
  # INFRAESTRUCTURA
  # ============================================================================

  db:
    image: postgres:16-alpine
    container_name: multicatalogo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-multicatalogo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # init.sql del Backend se monta como docker-entrypoint-initdb.d.
      # Solo se ejecuta la primera vez (cuando el volumen esta vacio).
      - ./Backend/database/init.sql:/docker-entrypoint-initdb.d/01-backend-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-multicatalogo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: multicatalogo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # APLICACIONES
  # ============================================================================

  auth-service:
    build:
      context: ./auth-service
    container_name: multicatalogo-auth-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      AUTH_DB_HOST: db
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:3001"
    healthcheck:
      # 127.0.0.1 y no localhost: dentro del contenedor "localhost" resuelve a
      # ::1 y el server escucha solo en IPv4, asi que wget no conecta.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/auth/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    container_name: multicatalogo-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # El entrypoint del Backend aplica database/migrations/*.sql, y la
      # migracion 004 re-apunta la FK de pedidos a auth.users: la tabla que
      # crea el entrypoint del auth-service. Sin esta dependencia el Backend
      # puede arrancar antes y fallar con 'auth.users no existe' (el
      # contenedor reintenta, pero es un reinicio avoidable).
      auth-service:
        condition: service_healthy
    env_file: .env
    environment:
      BACKEND_DB_HOST: db
      REDIS_HOST: redis
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  saas-api:
    build:
      # El directorio se renombro de Unidad3_SaaS a fastAPI_SaaS (PR #29);
      # con el path viejo el build fallaba.
      context: ./fastAPI_SaaS
    container_name: multicatalogo-saas-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SAAS_DB_HOST: db
    # Dos identidades, en este orden:
    #   1. alembic con el rol ADMIN (SAAS_DB_ADMIN_*): las migraciones hacen
    #      DDL (crean tablas, rol y politicas RLS) y eso no lo puede hacer el
    #      rol de la app.
    #   2. uvicorn con el rol de la APP (SAAS_DB_USER/SAAS_DB_PASSWORD, que en
    #      .env es saas_app). Con un superuser las politicas RLS de la
    #      migracion 0003 quedan inertes y cada request ve todos los tenants.
    command:
      - sh
      - -c
      - |
        SAAS_DB_ADMIN_USER="$${SAAS_DB_ADMIN_USER:-postgres}" \
        SAAS_DB_ADMIN_PASSWORD="$${SAAS_DB_ADMIN_PASSWORD:-postgres}" \
          uv run alembic upgrade head && \
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${SAAS_API_PORT:-8000}:8000"
    healthcheck:
      # La imagen del SaaS (uv + bookworm-slim) no trae wget: se usa el
      # python del propio venv. Con wget el contenedor queda unhealthy para
      # siempre y `depends_on` nunca lo da por listo.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/saas/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================================
  # GATEWAY
  # ============================================================================

  gateway:
    build:
      # Contexto en la RAIZ porque gateway/Dockerfile es multistage: compila
      # Frontend/ con node+pnpm y copia el dist a la imagen final de Caddy.
      # El .dockerignore de la raiz evita que el contexto mande ~440MB.
      context: .
      dockerfile: gateway/Dockerfile
    container_name: multicatalogo-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      backend:
        condition: service_healthy
      saas-api:
        condition: service_healthy
    environment:
      # TLS (#20). Forma de lista SIN valor, a proposito: Compose omite la
      # variable del contenedor cuando no esta definida, y entonces Caddy usa
      # el default del Caddyfile (http://localhost:8080).
      #
      # No usar `SITE_ADDRESS: ${SITE_ADDRESS:-}`: una variable vacia SI llega
      # al contenedor, el placeholder del Caddyfile no resuelve y Caddy no
      # arranca. Verificado con `caddy adapt`.
      - SITE_ADDRESS
      - ACME_EMAIL
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      # TLS (#20). Descomentar SOLO en un deploy con dominio real, y con
      # SITE_ADDRESS y ACME_EMAIL definidos en el `.env`:
      #   80 es necesario para el challenge HTTP-01 de Let's Encrypt.
      #   443 es el trafico HTTPS.
      # Se dejan comentados porque casi todos los hosts ya tienen algo en 80/443
      # y `docker compose up` falla al hacer bind de un puerto ocupado.
      # - "${HTTP_PORT:-80}:80"
      # - "${TLS_PORT:-443}:443"
    volumes:
      # Certificados de Caddy (/data) y su configuracion autogenerada (/config).
      # Sin esto, cada `up --force-recreate` pierde los certificados y Caddy
      # pide uno nuevo: Let's Encrypt permite 5 Emissions nuevas por semana
      # por dominio y el deploy se queda sin TLS a los pocos reinicios.
      - caddy_data:/data
      - caddy_config:/config
    # El healthcheck vive en el Dockerfile (HEALTHCHECK contra /health), asi que
    # no se repite aca. No se puede usar `/` comoprobe: pasa por
    # forward_auth y devolveria 401, dejando el contenedor unhealthy siempre.

  # ============================================================================
  # FRONTEND (solo desarrollo)
  # ============================================================================

  # Dev server de Vite con HMR sobre el codigo del host, en :5173.
  #
  # NO es parte del stack: el build de produccion del SPA lo compila el stage
  # `frontend` de gateway/Dockerfile y el gateway lo sirve en :8080. Este
  # servicio existe para iterar sin rebuild de imagen.
  #
  # El profile `dev` es lo que mantiene `docker compose up -d` (a secas)
  # sirviendo el SPA compilado y sin abrir :5173.
  frontend:
    profiles:
      - dev
    build:
      # Contexto raiz (igual que el gateway) para que aplique el mismo
      # .dockerignore y `node_modules`/`dist` del host no viajen al build.
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: multicatalogo-frontend
    restart: unless-stopped
    depends_on:
      # Sin `condition`: el gateway puede tardar en healthy mientras espera a
      # los backends y el dev server puede arrancar igual (solo cambia si el
      # /api falla en ese momento).
      - gateway
    environment:
      # Contrato de Frontend/vite.config.ts: el proxy de dev reenvia /api a
      # este target. En el host es http://localhost:8080; dentro de la red de
      # compose el gateway se llama `gateway`, no `localhost`.
      VITE_DEV_API_TARGET: ${VITE_DEV_API_TARGET:-http://gateway:8080}
      # Base relativa: el SPA habla con /api del mismo origen (:5173) y el
      # proxy de arriba lo lleva a la API real. Sin CORS y con la cookie
      # httpOnly auth_token viajando al mismo host.
      VITE_API_URL: /api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Codigo del host: HMR recompila al guardar.
      - ./Frontend:/app
      # node_modules en volumen con nombre: tapa el del host (que es del
      # sistema, no del contenedor) y preserva el que instalo la imagen al
      # construirla; Docker lo siembra en el primer arranque.
      # Si cambiaron dependencias: docker compose --profile dev build frontend
      # y despues `up -d` de nuevo.
      - frontend_node_modules:/app/node_modules

volumes:
  db_data:
    name: multicatalogo_db_data
  # node_modules del servicio frontend de dev (profile `dev`).
  frontend_node_modules:
  # Certificados y config autogenerada de Caddy. El nombre es explicito para
  # que `docker compose down -v` (el reset) no borre sin querer los
  # certificados de un deploy real.
  caddy_data:
  caddy_config:

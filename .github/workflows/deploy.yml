name: Build and Publish Images

# Construye y publica las imagenes de los 4 servicios del stack en GHCR.
#
# NO despliega: publicar una imagen no es ponerla corriendo. El deploy al host
# sigue siendo un paso manual (`docker compose pull && docker compose up -d`),
# que es la decision L6 del doc de seguimiento. Este workflow nunca habla con
# un servidor.
#
# Los nombres de imagen son los mismos que los servicios de docker-compose.yml,
# para que un `docker compose pull` con las tags correctas encuentre las
# imagenes sin traduccion:
#   ghcr.io/yan2005dris-afk/gateway
#   ghcr.io/yan2005dris-afk/backend
#   ghcr.io/yan2005dris-afk/saas-api
#   ghcr.io/yan2005dris-afk/auth-service

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  # Para repintar una imagen sin tocar el codigo (por ejemplo, si se agrega una
  # tag nueva a mano). No dispara nada salvo que alguien lo pida.
  workflow_dispatch:

# Por defecto el token de Actions no puede escribir paquetes: sin esto el
# login contra GHCR es rechazado.
permissions:
  contents: read
  packages: write

# Dos pushes seguidos a main no pelean por la misma tag. Cancelar el primero
# es lo correcto: su resultado ya quedo obsoleto.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      # Una falla y las demas siguen: public backend sin gateway es mejor que
      # no publicar nada, y el job que fallo queda marcado en rojo en la UI.
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./Backend
            dockerfile: Backend/Dockerfile
          - image: saas-api
            context: ./fastAPI_SaaS
            dockerfile: fastAPI_SaaS/Dockerfile
          - image: auth-service
            context: ./auth-service
            dockerfile: auth-service/Dockerfile
          # El gateway es el unico con contexto en la raiz: su Dockerfile es
          # multistage y compila el SPA con node+pnpm antes de copiar el dist.
          # Por eso ignora el .dockerignore de cada servicio y usa el de la raiz.
          - image: gateway
            context: .
            dockerfile: gateway/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # El actor es un usuario del repo y GITHUB_TOKEN es el token del
          # workflow: no hacen falta secretos propios para GHCR.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            # `latest` solo en main: una tag de version no debe moverla.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache por servicio: el gateway y el backend no comparten casi
          # capas, y un scope compartido los mezclaría.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
# Docker Compose para Producción (MultiCatalogo / Framework)
# Utiliza imágenes inmutables publicadas en GitHub Container Registry (GHCR)
# e integra Watchtower para despliegues continuos automáticos.
#
# Uso en la VM (desde /srv/framework):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env pull
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d

services:

  # ============================================================================
  # INFRAESTRUCTURA
  # ============================================================================

  db:
    image: postgres:16-alpine
    container_name: multicatalogo-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-multicatalogo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../Backend/database/init.sql:/docker-entrypoint-initdb.d/01-backend-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-multicatalogo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:alpine
    container_name: multicatalogo-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ============================================================================
  # MICROSERVICIOS DESDE GHCR
  # ============================================================================

  auth-service:
    image: ghcr.io/${GHCR_OWNER:-yan2005dris-afk}/auth-service:${IMAGE_TAG:-latest}
    container_name: multicatalogo-auth-service
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTH_DB_HOST: db
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-3001}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_EXPIRES_SECONDS: ${AUTH_JWT_EXPIRES_SECONDS:-7200}
      AUTH_DB_PORT: ${AUTH_DB_PORT:-5432}
      AUTH_DB_USER: ${AUTH_DB_USER:-postgres}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-multicatalogo}
      AUTH_DB_SCHEMA: ${AUTH_DB_SCHEMA:-auth}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/auth/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    image: ghcr.io/${GHCR_OWNER:-yan2005dris-afk}/backend:${IMAGE_TAG:-latest}
    container_name: multicatalogo-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      BACKEND_DB_HOST: db
      BACKEND_DB_PORT: ${BACKEND_DB_PORT:-5432}
      BACKEND_DB_USER: ${BACKEND_DB_USER:-postgres}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:-multicatalogo}
      BACKEND_DB_SSLMODE: ${BACKEND_DB_SSLMODE:-disable}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  saas-api:
    image: ghcr.io/${GHCR_OWNER:-yan2005dris-afk}/saas-api:${IMAGE_TAG:-latest}
    container_name: multicatalogo-saas-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SAAS_API_PORT: ${SAAS_API_PORT:-8000}
      SAAS_DB_HOST: db
      SAAS_DB_PORT: ${SAAS_DB_PORT:-5432}
      SAAS_DB_NAME: ${SAAS_DB_NAME:-multicatalogo}
      SAAS_DB_SSLMODE: ${SAAS_DB_SSLMODE:-disable}
      SAAS_DB_USER: ${SAAS_DB_USER:-saas_app}
      SAAS_DB_PASSWORD: ${SAAS_DB_PASSWORD}
      SAAS_DB_APP_ROLE: ${SAAS_DB_APP_ROLE:-saas_app}
      SAAS_DB_ADMIN_USER: ${SAAS_DB_ADMIN_USER:-postgres}
      SAAS_DB_ADMIN_PASSWORD: ${SAAS_DB_ADMIN_PASSWORD:-${POSTGRES_PASSWORD}}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    command:
      - sh
      - -c
      - |
        SAAS_DB_ADMIN_USER="$${SAAS_DB_ADMIN_USER:-postgres}" \
        SAAS_DB_ADMIN_PASSWORD="$${SAAS_DB_ADMIN_PASSWORD}" \
          uv run alembic upgrade head && \
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${SAAS_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/saas/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  gateway:
    image: ghcr.io/${GHCR_OWNER:-yan2005dris-afk}/gateway:${IMAGE_TAG:-latest}
    container_name: multicatalogo-gateway
    restart: always
    depends_on:
      auth-service:
        condition: service_healthy
      backend:
        condition: service_healthy
      saas-api:
        condition: service_healthy
    environment:
      - SITE_ADDRESS
      - ACME_EMAIL
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${HTTP_PORT:-80}:80"
      - "${TLS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

  # ============================================================================
  # CLOUDFLARE TUNNEL (Opcional)
  # ============================================================================

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: multicatalogo-cloudflared
    restart: always
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - internal

  # ============================================================================
  # AUTOMATIZACIÓN DE DESPLIEGUE CONTINUO (WATCHTOWER)
  # ============================================================================

  watchtower:
    image: containrrr/watchtower:latest
    container_name: multicatalogo-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Monta la configuración de docker del host donde se ejecutó 'docker login ghcr.io'
      - ${DOCKER_CONFIG_PATH:-/home/uadmin/.docker/config.json}:/config.json:ro
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=${WATCHTOWER_CLEANUP:-true}
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_REVIVE_STOPPED=false
      - WATCHTOWER_SCHEDULE=
    networks:
      - internal

volumes:
  db_data:
    name: multicatalogo_prod_db_data
  caddy_data:
    name: multicatalogo_prod_caddy_data
  caddy_config:
    name: multicatalogo_prod_caddy_config

networks:
  internal:
    name: multicatalogo_prod_net
    driver: bridge
